# ==============================================================================
# DeployForge — Full-Stack Container Orchestration (Docker Compose)
# ==============================================================================
# Services:
# 1. postgres: PostgreSQL 16 Alpine with persistent volume & health check
# 2. backend:  Spring Boot 3 REST API (waits for healthy database before starting)
# 3. frontend: React 18 + Vite SPA served via Nginx reverse proxy
#
# Usage:
#   docker compose up --build
#   docker compose down -v  (to clean up with volume data)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: PostgreSQL Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: deployforge-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_123}
    volumes:
      # Persistent named volume preserves problem catalogue, submissions, and users
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound strictly to loopback (127.0.0.1) to prevent public network exposure
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Probes PostgreSQL readiness to ensure backend doesn't start prematurely
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codearena}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deployforge-network

  # ----------------------------------------------------------------------------
  # 2. Application Tier: Spring Boot 3 REST API Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployforge-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      # Guarantees backend initializes only after PostgreSQL is fully ready
      postgres:
        condition: service_healthy
    environment:
      # Relational database connection string referencing internal Docker service name
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codearena}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_123}
      # JWT token security (HMAC-SHA256, 256-bit secret)
      JWT_SECRET: ${JWT_SECRET:-deployforge-super-secure-jwt-secret-key-32-chars-min}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      # Automated database problem seeder and admin bootstrapper
      SEED_DATA: ${SEED_DATA:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@codearena.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      # Java Virtual Machine runtime flags
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      # Exposes Spring Boot directly for direct backend testing or Swagger UI
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - deployforge-network

  # ----------------------------------------------------------------------------
  # 3. Presentation Tier: React Frontend + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deployforge-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Main entry point for users: http://localhost:80 (or custom $FRONTEND_PORT)
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - deployforge-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: deployforge-postgres-data

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  deployforge-network:
    name: deployforge-net
    driver: bridge
