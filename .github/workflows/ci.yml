# ==============================================================================
# DeployForge — Continuous Integration (CI) Pipeline
# ==============================================================================
# GitHub Actions automated workflow for CodeArena.
# Executes on every push and pull request to the 'main' branch:
# 1. Backend Verification: Java 17, Maven test & verify (JUnit 5 + Mockito + H2)
# 2. Frontend Verification: Node.js 20, npm ci, Vitest test suite, production Vite build
# 3. Docker Image Verification: Validates multi-stage Dockerfiles and Compose syntax
# ==============================================================================

name: DeployForge CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ensure concurrent runs on the same branch cancel previous in-flight runs to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Spring Boot Backend Build & Automated Verification
  # ----------------------------------------------------------------------------
  backend-verification:
    name: Backend Tests & Build (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Java 17 Development Kit (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Maven build and full test suite
        run: mvn clean verify -B
        env:
          # In-memory H2 database is utilized during automated testing
          SPRING_PROFILES_ACTIVE: test

      - name: Archive backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  # ----------------------------------------------------------------------------
  # Job 2: React Frontend Tests & Production Build
  # ----------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Tests & Build (Node.js 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies with strict clean install
        run: npm ci

      - name: Execute frontend test suite (Vitest + RTL)
        run: npm test

      - name: Compile TypeScript and build production bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Image & Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Build & Compose Syntax Validation
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose specification and environment syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Docker Compose syntax successfully validated."

      - name: Build Backend Docker Image (Multi-stage test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: deployforge-backend:ci

      - name: Build Frontend Docker Image (Multi-stage test)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: deployforge-frontend:ci
