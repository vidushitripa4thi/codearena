spring.application.name=codearena

# ==============================================================================
# Database Configuration (PostgreSQL)
# Reads from environment variables with local defaults.
# Set DB_PASSWORD in your environment or launch profile.
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codearena}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Security / JWT Configuration
# Set JWT_SECRET in your environment (minimum 256 bits / 32 characters).
# ==============================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
