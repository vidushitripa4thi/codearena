# ==============================================================================
# DeployForge — Nginx Reverse Proxy & Web Server Configuration
# ==============================================================================
# Serves React SPA static assets and reverse-proxies /api and Swagger calls
# to the internal Spring Boot backend container.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Security Response Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Gzip Compression for Performance Optimization
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Static Assets Cache Control (Vite hashed bundles in /assets/)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Backend REST API Reverse Proxy
    # Passes all /api calls directly to Spring Boot backend without path mangling
    # --------------------------------------------------------------------------
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Forward authentic client identification headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resilient timeout thresholds
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for reactive / streaming API compatibility
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Swagger UI & OpenAPI Specification Reverse Proxy
    # Enables interactive documentation access through the frontend web server
    # --------------------------------------------------------------------------
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Single Page Application (SPA) Fallback Routing
    # Any route not matching a physical file is rewritten to /index.html
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Custom HTTP error page handler
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
